name: Cross-platform tests

on:
  push:
    branches: ['main', 'fix/**', 'ci/**']
  pull_request:
    branches: ['main', 'fix/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      EIK_REQUIRE_NATIVE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter version
        run: python --version
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install hash-locked signing dependencies
        run: >-
          python -m pip --isolated install --force-reinstall --no-cache-dir --require-hashes --index-url https://pypi.org/simple --only-binary=:all: --report signing-install-report.json -r requirements-signing.txt
      - name: Verify installed wheel evidence and record crypto runtime
        run: python tools/verify_signing_environment.py --report signing-install-report.json --lock requirements-signing.txt
      - name: Check signing dependency consistency
        run: python -m pip check
      - name: Run signed-manifest tests (required)
        run: python -m unittest discover -s tests_crypto -v
      - name: Native synthetic Btrfs snapshot fixture (required on Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v mkfs.btrfs >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y btrfs-progs
          fi
          bash tools/test_linux_btrfs_snapshot.sh

  release-provider-policy:
    name: Signing provider release gate / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked signing dependencies
        run: >-
          python -m pip --isolated install --force-reinstall --no-cache-dir --require-hashes --index-url https://pypi.org/simple --only-binary=:all: --report signing-install-report.json -r requirements-signing.txt
      - name: Verify installed wheel evidence
        run: python tools/verify_signing_environment.py --report signing-install-report.json --lock requirements-signing.txt
      - name: Require reviewed signing provider
        run: python tools/check_release_provider.py

  validator-evaluation:
    name: Validator evaluation / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/ed25519-validator-evaluation' && github.base_ref == 'fix/key-policy-review-packet'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Download hash-locked evaluation wheels
        run: >-
          python -m pip --isolated download --no-cache-dir --require-hashes --index-url https://pypi.org/simple --only-binary=:all: --dest validator-wheelhouse -r evaluation/requirements-validator.txt
      - name: Verify wheel byte digests
        run: python -m evaluation.verify_wheels
      - name: Install verified wheels offline
        run: >-
          python -m pip --isolated install --force-reinstall --no-index --find-links validator-wheelhouse --require-hashes --only-binary=:all: -r evaluation/requirements-validator.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise synthetic point validation
        run: python -m unittest discover -s evaluation -v
  provenance-diagnostic:
    name: Isolated PyPI provenance diagnostic
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/ed25519-validator-evaluation' && github.base_ref == 'fix/key-policy-review-packet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install diagnostic verifier in separate virtual environment
        run: |
          python -m venv .provenance-venv
          .provenance-venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --report verifier-install-report.json pypi-attestations==0.0.32
          .provenance-venv/bin/python -m pip check
          .provenance-venv/bin/python -m pip freeze
          cat verifier-install-report.json
      - name: Check locked wheel bytes and available publisher attestations
        run: .provenance-venv/bin/python -m evaluation.provenance_diagnostic
