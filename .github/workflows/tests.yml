name: Cross-platform tests

on:
  push:
    branches: ['main', 'fix/**', 'ci/**']
  pull_request:
    branches: ['main', 'fix/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter version
        run: python --version
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned candidate signing dependencies
        run: >-
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: -r requirements-signing.txt
      - name: Check signing dependency consistency
        run: python -m pip check
      - name: Run Ed25519 primitive tests (required)
        run: python -m unittest discover -s tests_crypto -v
