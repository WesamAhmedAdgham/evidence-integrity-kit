name: Cross-platform tests

on:
  push:
    branches: ['main', 'fix/**', 'ci/**']
  pull_request:
    branches: ['main', 'fix/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      EIK_REQUIRE_NATIVE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter version
        run: python --version
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify core has no signing capability or third-party dependency
        run: python -S -m unittest discover -s tests -p test_unsigned_scope.py -v

  release-provider-policy:
    name: Signing provider release gate / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EIK_REQUIRE_NATIVE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Require exact unsigned payload (provider not applicable only here)
        run: python -B -S tools/check_unsigned_scope.py
      - name: Verify fail-closed scope policy
        run: python -B -S -m unittest discover -s tests -p test_unsigned_scope_gate.py -v
      - name: Verify no signing CLI and no site packages
        run: python -B -S -m unittest discover -s tests -p test_unsigned_scope.py -v
