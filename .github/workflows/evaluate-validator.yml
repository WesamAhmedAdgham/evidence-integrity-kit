name: Isolated Ed25519 validator evaluation

on:
  pull_request:
    branches: ['fix/key-policy-review-packet']

permissions:
  contents: read

jobs:
  evaluate:
    if: github.head_ref == 'fix/ed25519-validator-evaluation'
    name: Validator evaluation / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Download only hash-locked evaluation wheels
        run: python -m pip --isolated download --no-cache-dir --require-hashes --index-url https://pypi.org/simple --only-binary=:all: --dest validator-wheelhouse -r evaluation/requirements-validator.txt
      - name: Independently hash downloaded wheel bytes
        run: python -m evaluation.verify_wheels
      - name: Install verified wheels offline in dedicated runner
        run: python -m pip --isolated install --force-reinstall --no-index --find-links validator-wheelhouse --require-hashes --only-binary=:all: -r evaluation/requirements-validator.txt
      - run: python -m pip check
      - name: Exercise candidate validator (synthetic keys only)
        run: python -m unittest discover -s evaluation -p test_validator.py -v
